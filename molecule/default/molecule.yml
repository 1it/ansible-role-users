---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml

driver:
  name: docker

platforms:
  - name: instance
    image: "{{ lookup('env', 'MOLECULE_DISTRO') | default('debian:12', true) }}"
    pre_build_image: true
    command: "sleep infinity"

provisioner:
  name: ansible
  config_options:
    defaults:
      callbacks_enabled: profile_tasks,timer
      result_format: yaml
  inventory:
    host_vars:
      instance:
        ansible_connection: community.docker.docker
        ansible_python_interpreter: /usr/bin/python3

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
