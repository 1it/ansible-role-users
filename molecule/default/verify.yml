---
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Verify testuser1 and testuser2 exist
      ansible.builtin.getent:
        database: passwd
        key: "{{ item }}"
      loop:
        - testuser1
        - testuser2

    - name: Verify developers and testers groups exist
      ansible.builtin.getent:
        database: group
        key: "{{ item }}"
      loop:
        - developers
        - testers

    - name: Verify no empty group exists
      ansible.builtin.getent:
        database: group
        key: "[]"
        fail_key: false
      register: empty_group_check

    - name: Assert no empty group was created
      ansible.builtin.assert:
        that:
          - empty_group_check.ansible_facts.getent_group['[]'] is none
        success_msg: "No empty group found"
