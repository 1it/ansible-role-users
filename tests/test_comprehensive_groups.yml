---
- name: Test users_group_list empty and populated scenarios
  hosts: localhost
  connection: local
  gather_facts: true
  tasks:
    - name: Run role with empty users_group_list
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/.."
      vars:
        users_group_list: []
        users: []

    - name: Verify no empty group was created
      ansible.builtin.getent:
        database: group
        key: "[]"
        fail_key: false
      register: empty_group_check

    - name: Assert no empty group exists
      ansible.builtin.assert:
        that:
          - empty_group_check.ansible_facts.getent_group['[]'] is none
        fail_msg: "FAILED: Empty group '[]' found in system!"

    - name: Run role with actual groups and extra groups
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/.."
      vars:
        users_group_list:
          - name: testgroup1
            state: present
        users_extra_groups:
          - name: testgroup2
            state: present
        users: []

    - name: Verify test groups were created
      ansible.builtin.getent:
        database: group
        key: "{{ item }}"
      loop:
        - testgroup1
        - testgroup2

    - name: Cleanup test groups
      ansible.builtin.group:
        name: "{{ item }}"
        state: absent
      loop:
        - testgroup1
        - testgroup2
