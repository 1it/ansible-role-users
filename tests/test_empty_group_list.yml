---
- name: Test empty users_group_list with gather_facts disabled
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    users_group_list: []
    users:
      - username: testuser
        name: Test User
        uid: 9999
        state: present
        authorized: []

  tasks:
    - name: Run role with empty users_group_list
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/.."

  post_tasks:
    - name: Check that no empty group was created
      ansible.builtin.getent:
        database: group
        key: "[]"
        fail_key: false
      register: empty_group_check

    - name: Assert no empty group exists
      ansible.builtin.assert:
        that:
          - empty_group_check.ansible_facts.getent_group['[]'] is none
        fail_msg: "ERROR: Empty group '[]' was found on the system!"

    - name: Clean up test user
      ansible.builtin.user:
        name: testuser
        state: absent
        remove: true
      failed_when: false
