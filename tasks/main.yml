---
- name: Prepare | Validate inputs and resolve host-specific users
  ansible.builtin.import_tasks: prepare.yml
  tags:
    - always

- name: Prerequisites | Ensure required packages are available
  ansible.builtin.import_tasks: prerequisites.yml
  when: users_manage_prerequisites | bool
  tags:
    - users
    - users_prerequisites

- name: Groups | Manage primary and supplementary groups
  ansible.builtin.import_tasks: groups.yml
  tags:
    - users
    - users_groups
    - groups

- name: Accounts | Manage user accounts and home directories
  ansible.builtin.import_tasks: accounts.yml
  tags:
    - users
    - users_accounts
    - accounts

- name: SSH | Manage SSH directories and authorized keys
  ansible.builtin.import_tasks: ssh.yml
  tags:
    - users
    - users_ssh
    - ssh
    - security

- name: Sudoers | Manage per-user sudoers drop-ins
  ansible.builtin.import_tasks: sudoers.yml
  tags:
    - users
    - users_sudoers
    - sudoers
    - security

- name: Limits | Manage PAM resource limits drop-in
  ansible.builtin.import_tasks: limits.yml
  tags:
    - users
    - users_limits
    - limits
    - security

- name: Linger | Manage systemd user lingering
  ansible.builtin.import_tasks: linger.yml
  tags:
    - users
    - users_linger
    - linger

- name: Cleanup | Remove absent groups, drop-ins, and optional home directories
  ansible.builtin.import_tasks: cleanup.yml
  tags:
    - users
    - users_cleanup
    - cleanup
