---
- name: Linger | Check whether systemd is running
  ansible.builtin.stat:
    path: /run/systemd/system
  register: _users_systemd_running
  when: (_users_present | selectattr('linger', 'defined') | list | length) > 0

- name: Linger | Check current user linger state
  ansible.builtin.stat:
    path: "/var/lib/systemd/linger/{{ _user.username }}"
  register: _users_linger_stats
  loop: "{{ _users_present | selectattr('linger', 'defined') | list }}"
  loop_control:
    loop_var: _user
    label: "{{ _user.username }}"
  when:
    - _users_systemd_running.stat.exists | default(false)

- name: Linger | Enable systemd user lingering
  ansible.builtin.command:
    argv:
      - loginctl
      - enable-linger
      - "{{ _linger_item._user.username }}"
  loop: "{{ _users_linger_stats.results | default([]) }}"
  loop_control:
    loop_var: _linger_item
    label: "{{ _linger_item._user.username }}"
  changed_when: true
  when:
    - _users_systemd_running.stat.exists | default(false)
    - _linger_item._user.linger | bool
    - not (_linger_item.stat.exists | default(false))

- name: Linger | Disable systemd user lingering
  ansible.builtin.command:
    argv:
      - loginctl
      - disable-linger
      - "{{ _linger_item._user.username }}"
  loop: "{{ _users_linger_stats.results | default([]) }}"
  loop_control:
    loop_var: _linger_item
    label: "{{ _linger_item._user.username }}"
  changed_when: true
  when:
    - _users_systemd_running.stat.exists | default(false)
    - not (_linger_item._user.linger | bool)
    - _linger_item.stat.exists | default(false)
