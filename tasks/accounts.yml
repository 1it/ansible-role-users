---
- name: Accounts | Manage present user accounts
  ansible.builtin.user:
    name: "{{ _user.username }}"
    state: present
    uid: "{{ _user.uid | default(omit) }}"
    group: "{{ _user_primary_group }}"
    groups: "{{ _user.groups | default(omit) }}"
    append: "{{ _user.append | default(users_groups_append) | bool }}"
    shell: "{{ _user.shell | default(users_default_system_shell if (_user.system | default(false) | bool) else users_default_shell) }}"
    system: "{{ _user.system | default(false) | bool }}"
    create_home: "{{ _user_create_home | bool }}"
    home: "{{ _user_home if (_user.home is defined or not (_user.system | default(false) | bool) or (_user_create_home | bool)) else omit }}"
    comment: "{{ _user.name | default(omit) }}"
    password: "{{ _user.password | default(omit) }}"
    update_password: "{{ _user.update_password | default(users_default_update_password) }}"
    password_lock: "{{ _user.password_lock | default(omit) }}"
    expires: "{{ _user.expires | default(omit) }}"
    generate_ssh_key: "{{ _user.generate_key | default(false) | bool }}"
    ssh_key_type: "{{ _ssh_key_type if (_user.generate_key | default(false) | bool) else omit }}"
    ssh_key_bits: "{{ _ssh_key_bits if (_user.generate_key | default(false) | bool) else omit }}"
    ssh_key_file: "{{ (_user.ssh_key_file | default('.ssh/id_' ~ _ssh_key_type)) if (_user.generate_key | default(false) | bool) else omit }}"
    ssh_key_comment: "{{ (_user.ssh_key_comment | default(_user.username ~ '@' ~ ansible_facts['hostname'])) if (_user.generate_key | default(false) | bool) else omit }}"
  vars:
    _user_primary_group: "{{ _user.group | default(_user.username if (users_create_group_per_user | bool) else users_default_group) }}"
    _user_home: "{{ _user.home | default(users_home_base ~ '/' ~ _user.username) }}"
    _user_create_home: >-
      {{
        (_user.create_home | bool)
        if (_user.create_home is defined)
        else (
          (users_create_homedir | bool)
          and (
            not (_user.system | default(false) | bool)
            or (_user.home is defined)
            or (_user.generate_key | default(false) | bool)
            or ((_user.authorized | default([])) | length > 0)
          )
        )
      }}
    _ssh_key_type: "{{ _user.ssh_key_type | default(users_default_ssh_key_type) }}"
    _ssh_key_bits: "{{ _user.ssh_key_bits if (_user.ssh_key_bits is defined) else (omit if _ssh_key_type == 'ed25519' else users_default_ssh_key_bits) }}"
  loop: "{{ _users_present }}"
  loop_control:
    loop_var: _user
    label: "{{ _user.username }}"
  no_log: "{{ (users_no_log | bool) and ((_users_present | selectattr('password', 'defined') | list | length) > 0) }}"

- name: Accounts | Ensure home directory ownership and permissions
  ansible.builtin.file:
    path: "{{ _user_home_normalized }}"
    state: directory
    owner: "{{ _user.username }}"
    group: "{{ _user_primary_group }}"
    mode: "{{ _user.home_mode | default(users_home_mode) }}"
  vars:
    _user_primary_group: "{{ _user.group | default(_user.username if (users_create_group_per_user | bool) else users_default_group) }}"
    _user_home_raw: "{{ _user.home | default(users_home_base ~ '/' ~ _user.username) }}"
    _user_home_normalized: "{{ (_user_home_raw | regex_replace('/+$', '')) or '/' }}"
    _user_create_home: >-
      {{
        (_user.create_home | bool)
        if (_user.create_home is defined)
        else (
          (users_create_homedir | bool)
          and (
            not (_user.system | default(false) | bool)
            or (_user.home is defined)
            or (_user.generate_key | default(false) | bool)
            or ((_user.authorized | default([])) | length > 0)
          )
        )
      }}
  loop: "{{ _users_present }}"
  loop_control:
    loop_var: _user
    label: "{{ _user.username }}"
  when:
    - _user_create_home | bool
    - _user_home_normalized not in users_protected_home_paths
  tags:
    - directories
    - security

- name: Accounts | Recursively ensure home directory ownership (opt-in)
  ansible.builtin.file:
    path: "{{ _user_home_normalized }}"
    state: directory
    owner: "{{ _user.username }}"
    group: "{{ _user_primary_group }}"
    recurse: true
  vars:
    _user_primary_group: "{{ _user.group | default(_user.username if (users_create_group_per_user | bool) else users_default_group) }}"
    _user_home_raw: "{{ _user.home | default(users_home_base ~ '/' ~ _user.username) }}"
    _user_home_normalized: "{{ (_user_home_raw | regex_replace('/+$', '')) or '/' }}"
    _user_create_home: >-
      {{
        (_user.create_home | bool)
        if (_user.create_home is defined)
        else (
          (users_create_homedir | bool)
          and (
            not (_user.system | default(false) | bool)
            or (_user.home is defined)
            or (_user.generate_key | default(false) | bool)
            or ((_user.authorized | default([])) | length > 0)
          )
        )
      }}
  loop: "{{ _users_present }}"
  loop_control:
    loop_var: _user
    label: "{{ _user.username }}"
  when:
    - _user_create_home | bool
    - _user.homedir_recurse | default(users_homedir_recurse) | bool
    - _user_home_normalized not in users_protected_home_paths
  tags:
    - directories
    - security

- name: Accounts | Remove absent user accounts
  ansible.builtin.user:
    name: "{{ _user.username }}"
    state: absent
    remove: "{{ (_user.delete_homedir | default(_users_effective_delete_homedirs) | bool) and (_user_home_normalized not in users_protected_home_paths) }}"
    force: "{{ _user.force | default(users_force_remove) | bool }}"
  vars:
    _user_home_raw: "{{ _user.home | default(users_home_base ~ '/' ~ _user.username) }}"
    _user_home_normalized: "{{ (_user_home_raw | regex_replace('/+$', '')) or '/' }}"
  loop: "{{ _users_absent }}"
  loop_control:
    loop_var: _user
    label: "{{ _user.username }}"
