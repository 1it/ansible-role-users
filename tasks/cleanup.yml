---
- name: Cleanup | Remove absent additional groups
  ansible.builtin.group:
    name: "{{ _group.name }}"
    state: absent
    force: "{{ true if (_group.force | default(false) | bool) else omit }}"
  loop: "{{ _users_groups_absent }}"
  loop_control:
    loop_var: _group
    label: "{{ _group.name }}"

- name: Cleanup | Remove absent user per-user primary groups
  ansible.builtin.group:
    name: "{{ _user.username }}"
    state: absent
  vars:
    _protected_group_names: >-
      {{
        (_users_groups_present | map(attribute='name') | list)
        + (_users_present | selectattr('group', 'defined') | map(attribute='group') | list)
        + ([users_default_group] if not (users_create_group_per_user | bool) else [])
      }}
  loop: "{{ _users_absent }}"
  loop_control:
    loop_var: _user
    label: "{{ _user.username }}"
  when:
    - users_create_group_per_user | bool
    - _user.group is not defined
    - _user.username not in _protected_group_names

- name: Cleanup | Remove sudoers drop-ins for absent users
  ansible.builtin.file:
    path: "{{ users_sudoers_dir }}/{{ users_sudoers_file_prefix }}{{ _user.username | replace('_', '__') | replace('.', '_dot_') }}"
    state: absent
  loop: "{{ _users_absent }}"
  loop_control:
    loop_var: _user
    label: "{{ _user.username }}"
  tags:
    - sudoers
    - security

- name: Cleanup | Remove systemd linger files for absent users
  ansible.builtin.file:
    path: "/var/lib/systemd/linger/{{ _user.username }}"
    state: absent
  loop: "{{ _users_absent }}"
  loop_control:
    loop_var: _user
    label: "{{ _user.username }}"
  tags:
    - linger

- name: Cleanup | Resolve existing passwd homes when cleanup runs standalone
  ansible.builtin.getent:
    database: passwd
    key: "{{ _user.username }}"
    fail_key: false
  register: _users_cleanup_passwd_lookup
  loop: "{{ _users_absent }}"
  loop_control:
    loop_var: _user
    label: "{{ _user.username }}"
  when:
    - _users_absent | length > 0
    - not (_users_absent_homes_resolved | default(false) | bool)
  tags:
    - directories

- name: Cleanup | Record standalone passwd homes for guarded cleanup
  ansible.builtin.set_fact:
    _users_absent_passwd_homes: >-
      {{
        _users_absent_passwd_homes
        | combine({_lookup_item._user.username: ((_passwd_entry[4] | regex_replace('/+', '/') | regex_replace('/+$', '')) or '/')})
      }}
  vars:
    _passwd_entry: "{{ (_lookup_item.ansible_facts.getent_passwd | default({})).get(_lookup_item._user.username) }}"
  loop: "{{ _users_cleanup_passwd_lookup.results | default([]) }}"
  loop_control:
    loop_var: _lookup_item
    label: "{{ _lookup_item._user.username }}"
  when:
    - not (_lookup_item.skipped | default(false))
    - _passwd_entry is sequence
    - _passwd_entry is not string
    - _passwd_entry | length > 4
  tags:
    - directories

- name: Cleanup | Resolve target realpaths for absent user homes
  ansible.builtin.command:
    argv:
      - readlink
      - -m
      - --
      - "{{ _user_home_normalized }}"
  vars:
    _user_home_raw: "{{ _users_absent_passwd_homes.get(_user.username, _user.home | default(users_home_base ~ '/' ~ _user.username)) }}"
    _user_home_normalized: "{{ (_user_home_raw | regex_replace('/+', '/') | regex_replace('/+$', '')) or '/' }}"
  register: _users_absent_realpath_lookup
  changed_when: false
  loop: "{{ _users_absent }}"
  loop_control:
    loop_var: _user
    label: "{{ _user.username }}"
  when:
    - _users_absent | length > 0
    - _user.delete_homedir | default(_users_effective_delete_homedirs) | bool
  tags:
    - directories

- name: Cleanup | Record resolved realpaths for absent user homes
  ansible.builtin.set_fact:
    _users_absent_home_realpaths: >-
      {{
        (_users_absent_home_realpaths | default({}))
        | combine({_rp_item._user.username: ((_rp_item.stdout | trim | regex_replace('/+', '/') | regex_replace('/+$', '')) or '/')})
      }}
  loop: "{{ _users_absent_realpath_lookup.results | default([]) }}"
  loop_control:
    loop_var: _rp_item
    label: "{{ _rp_item._user.username }}"
  when:
    - not (_rp_item.skipped | default(false))
    - (_rp_item.stdout | default('') | trim | length) > 0
  tags:
    - directories

- name: Cleanup | Remove home directories for absent users (opt-in)
  ansible.builtin.file:
    path: "{{ _user_home_normalized }}"
    state: absent
  vars:
    _user_home_raw: "{{ _users_absent_passwd_homes.get(_user.username, _user.home | default(users_home_base ~ '/' ~ _user.username)) }}"
    _user_home_normalized: "{{ (_user_home_raw | regex_replace('/+', '/') | regex_replace('/+$', '')) or '/' }}"
    _user_home_realpath: "{{ (_users_absent_home_realpaths | default({})).get(_user.username, _user_home_normalized) }}"
  loop: "{{ _users_absent }}"
  loop_control:
    loop_var: _user
    label: "{{ _user.username }}"
  when:
    - _user.delete_homedir | default(_users_effective_delete_homedirs) | bool
    - not (_user_home_normalized is regex('(^|/)\\.{1,2}($|/)'))
    - _user_home_normalized not in _users_protected_paths_norm
    - _user_home_realpath not in _users_protected_paths_norm
  tags:
    - directories
